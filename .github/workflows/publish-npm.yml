name: Publish npm package

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/publish-npm.yml'

permissions:
  contents: read

jobs:
  publish:
    # One-time merge-triggered initial publication; future runs are manual.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release: publish Paperclip Chinese v0.2.2')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate
        run: |
          pnpm typecheck
          pnpm test
          pnpm build
      - name: Inspect npm archive
        run: npm pack --dry-run
      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
